name: Trigger Main Repo Update

on:
  push:
    branches:
      - main # Change to master if needed

jobs:
  ping-main:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch event
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MAIN_REPO_UPDATE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com{{ github.repository_owner }}/YOUR_MAIN_REPO_NAME/dispatches \
            -d '{"event_type": "submodule_updated"}'
